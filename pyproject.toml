[project]
name = "customer-service-ai-system"
version = "0.1.0"
description = "Multi-lingual automated IVR, SMS, and Email support platform."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "edge-tts>=6.1.0",
    "miniaudio>=1.59.0",
    "numpy>=1.26.0",
    "ollama>=0.1.7",
    "phonenumbers>=8.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: optional tests that download or run large local models",
]

[tool.vercel]
entrypoint = "app.main:app"
